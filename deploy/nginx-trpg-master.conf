map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=trpg_auth:10m rate=10r/m;
# 全局单 IP 请求上限（阶段 3）。WebSocket 握手只计一次请求，长连接不被限流。
limit_req_zone $binary_remote_addr zone=trpg_api:10m rate=20r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name trpggame.xyz www.trpggame.xyz;
    return 301 https://trpggame.xyz$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name trpggame.xyz;

    ssl_certificate /etc/letsencrypt/live/trpggame.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trpggame.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    limit_req_status 429;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 64m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        limit_req zone=trpg_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }

    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=trpg_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.trpggame.xyz;

    ssl_certificate /etc/letsencrypt/live/trpggame.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trpggame.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://trpggame.xyz$request_uri;
}
